# EXP-03: c5-gateway-cpu1000 with 3 replicas of gateway and of fastapi.
# Everything else is taken from kind-c5-gateway-cpu1000.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../kind-c5-gateway-cpu1000

patches:
  - target:
      kind: Deployment
      name: "(fastapi|gateway)"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
